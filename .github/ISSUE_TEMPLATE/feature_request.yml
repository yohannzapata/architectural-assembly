name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to build?
      description: Describe the building workflow or problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Architectural Assembly help?
