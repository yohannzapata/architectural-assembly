name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add Architectural Assembly to ...
        2. ...
    validations:
      required: true
  - type: input
    id: blender
    attributes:
      label: Blender version
      placeholder: "5.2.2"
    validations:
      required: true
  - type: input
    id: addon
    attributes:
      label: Add-on version
      placeholder: "0.1.0"
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, .blend file or console output
